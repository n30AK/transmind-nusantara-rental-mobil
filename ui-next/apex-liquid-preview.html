<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TransMind — Apex Liquid Glass Preview</title>
<style>
html,body{margin:0;height:100%;background:#05070a;color:#fff;overflow:hidden}
iframe{display:block;width:100%;height:100%;border:0}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#05070a;font:600 13px system-ui;letter-spacing:.12em;z-index:9}
</style>
</head>
<body>
<div id="loading">TRANSMIND · LIQUID GLASS PREVIEW</div>
<iframe id="core" src="../index.html" title="TransMind core staging preview"></iframe>
<script>
const frame=document.getElementById('core');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    const link=d.createElement('link');
    link.rel='stylesheet';
    link.href='apex-liquid-glass.css';
    d.head.appendChild(link);
    document.getElementById('loading').remove();
  }catch(e){
    document.getElementById('loading').textContent='Preview loaded — refresh if styles do not appear.';
  }
});
</script>
</body>
</html>
