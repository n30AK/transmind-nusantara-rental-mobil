name: Build Transmind Partner Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-partner/**"
      - ".github/workflows/android-partner-apk.yml"

permissions:
  contents: read

jobs:
  build-partner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-partner
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload Partner APK
        uses: actions/upload-artifact@v4
        with:
          name: transmind-partner-debug-apk
          path: android-partner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
