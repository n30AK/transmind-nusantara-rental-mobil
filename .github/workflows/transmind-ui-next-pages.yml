name: TransMind UI Next — Staging Preview

on:
  workflow_dispatch:
  push:
    branches:
      - staging/transmind-ui-next-20260923

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: transmind-ui-next-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4

      - name: Prepare static preview
        run: |
          mkdir -p _site
          cp ui-next/core-preview.html _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
