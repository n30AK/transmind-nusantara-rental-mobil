name: TransMind Nexus SEO + AI QA
on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 2 * * *"
  pull_request:
    branches: ["main"]
    paths:
      - "index.html"
      - "demand/**"
      - "rental-mobil-*.html"
      - "supabase/functions/transmind-ai/**"
      - "docs/08-SEO-GROWTH/**"
      - "docs/09-AI/**"
      - "nexus/**"
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SEO essentials
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'rel="canonical"' index.html
          grep -q 'name="robots" content="index,follow' index.html
          grep -q 'application/ld+json' index.html
          test -f sitemap.xml
          test -f robots.txt
          grep -q 'Sitemap:' robots.txt
      - name: Validate AI and booking contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'bookingForm' index.html
          grep -q 'transmind-ai-launcher' index.html
          grep -q 'TRANSMIND_AI_ENDPOINT' config.js
          grep -q 'vehicle_prices' supabase/functions/transmind-ai/index.ts
          grep -q 'crm_tasks' supabase/functions/transmind-ai/index.ts
          grep -q 'nexus_communications' supabase/functions/transmind-ai/index.ts
          test -f nexus/ai-customer-service-console.js
      - name: Validate Deno syntax
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/transmind-ai/index.ts
      - name: Validate browser JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in nexus/*.js ai-companion-customer-care.js ai-live-travel.js app.js conversion-bridge.js attribution.js whatsapp-identity-bridge.js; do node --check "$f"; done

      - name: Validate local SEO pages
        shell: bash
        run: |
          set -euo pipefail
          for f in rental-mobil-jakarta.html rental-mobil-bekasi.html rental-mobil-bogor.html rental-mobil-depok.html rental-mobil-tangerang.html rental-mobil-lepas-kunci-jabodetabek.html rental-mobil-dengan-driver-jabodetabek.html rental-mobil-corporate-jabodetabek.html rental-mobil-wedding-jabodetabek.html rental-mobil-pariwisata-jabodetabek.html demand/index.html; do
            test -f "$f"
            grep -q 'canonical' "$f"
            grep -q 'Transmind' "$f"
          done


      - name: Validate sitemap URLs and internal SEO graph
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          sitemap = Path("sitemap.xml").read_text(encoding="utf-8")
          urls = re.findall(r"<loc>(https://transmindnusantararentalmobil\.co\.id/[^<]*)</loc>", sitemap)
          assert urls, "No sitemap URLs found"
          for url in urls:
              path = url.replace("https://transmindnusantararentalmobil.co.id/","") or "index.html"
              if path.endswith("/"):
                  path = path + "index.html"
              p = Path(path)
              assert p.exists(), f"Sitemap URL missing local file: {path}"
              html = p.read_text(encoding="utf-8")
              assert 'rel="canonical"' in html, f"Missing canonical: {path}"
              assert 'name="description"' in html, f"Missing description: {path}"
              assert 'application/ld+json' in html, f"Missing structured data: {path}"
          home = Path("index.html").read_text(encoding="utf-8")
          for path in [u.replace("https://transmindnusantararentalmobil.co.id/","") for u in urls if u.endswith(".html") and u.replace("https://transmindnusantararentalmobil.co.id/","") != "demand/index.html"]:
              assert f'href="/{path}"' in home or f'href="{path}"' in home, f"Homepage missing internal link: {path}"
          print(f"SEO graph validated: {len(urls)} sitemap URLs")
          PY
