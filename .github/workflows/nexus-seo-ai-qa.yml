name: TransMind Nexus SEO + AI QA
on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 2 * * *"
  pull_request:
    branches: ["main"]
    paths:
      - "index.html"
      - "demand/**"
      - "rental-mobil-*.html"
      - "panduan-*.html"
      - "supabase/functions/transmind-ai/**"
      - "docs/08-SEO-GROWTH/**"
      - "docs/09-AI/**"
      - "nexus/**"
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SEO essentials
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'rel="canonical"' index.html
          grep -q 'name="robots" content="index,follow' index.html
          grep -q 'application/ld+json' index.html
          test -f sitemap.xml
          test -f robots.txt
          grep -q 'Sitemap:' robots.txt
      - name: Validate AI and booking contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'bookingForm' index.html
          grep -q 'transmind-ai-launcher' index.html
          grep -q 'TRANSMIND_AI_ENDPOINT' config.js
          grep -q 'vehicle_prices' supabase/functions/transmind-ai/index.ts
          grep -q 'crm_tasks' supabase/functions/transmind-ai/index.ts
          grep -q 'nexus_communications' supabase/functions/transmind-ai/index.ts
          test -f nexus/ai-customer-service-console.js
      - name: Validate Deno syntax
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/transmind-ai/index.ts
      - name: Validate browser JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in nexus/*.js ai-companion-customer-care.js ai-live-travel.js app.js conversion-bridge.js attribution.js whatsapp-identity-bridge.js; do node --check "$f"; done

      - name: Validate local SEO pages
        shell: bash
        run: |
          set -euo pipefail
          for f in rental-mobil-jakarta.html rental-mobil-bekasi.html rental-mobil-bogor.html rental-mobil-depok.html rental-mobil-tangerang.html rental-mobil-lepas-kunci-jabodetabek.html rental-mobil-dengan-driver-jabodetabek.html rental-mobil-corporate-jabodetabek.html rental-mobil-wedding-jabodetabek.html rental-mobil-pariwisata-jabodetabek.html demand/index.html; do
            test -f "$f"
            grep -q 'canonical' "$f"
            grep -q 'Transmind' "$f"
          done

      - name: Validate sitemap URLs and internal SEO graph
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          sitemap = Path("sitemap.xml").read_text(encoding="utf-8")
          urls = re.findall(r"<loc>(https://transmindnusantararentalmobil\.co\.id/[^<]*)</loc>", sitemap)
          assert urls, "No sitemap URLs found"

          local_pages = {}
          for p in [Path("index.html"), *Path(".").glob("*.html"), *Path("demand").glob("*.html")]:
              if p.exists():
                  local_pages[p.as_posix()] = p.read_text(encoding="utf-8")

          for url in urls:
              path = url.replace("https://transmindnusantararentalmobil.co.id/","") or "index.html"
              if path.endswith("/"):
                  path = path + "index.html"
              p = Path(path)
              assert p.exists(), f"Sitemap URL missing local file: {path}"
              html = p.read_text(encoding="utf-8")
              assert 'rel="canonical"' in html, f"Missing canonical: {path}"
              assert 'name="description"' in html, f"Missing description: {path}"
              assert 'application/ld+json' in html, f"Missing structured data: {path}"

          # The homepage is the primary hub, but deeper guide/service pages do not
          # need to be linked directly from it. Validate a real internal-link graph:
          # every indexed HTML page must have at least one inbound internal link,
          # while the homepage itself is the root and demand hub is intentionally
          # excluded from this inbound-link requirement.
          normalized_urls = []
          for u in urls:
              path = u.replace("https://transmindnusantararentalmobil.co.id/","") or "index.html"
              if path.endswith("/"):
                  path = path + "index.html"
              normalized_urls.append(path)

          inbound = {p: 0 for p in normalized_urls if p not in ("index.html", "demand/index.html")}
          href_re = re.compile(r'href=["\'](?:https://transmindnusantararentalmobil\.co\.id)?/?([^"\'#?]+)["\']', re.I)

          for source_path, html in local_pages.items():
              for href_path in href_re.findall(html):
                  clean = href_path.lstrip("/")
                  if clean in inbound:
                      inbound[clean] += 1

          missing = [p for p, count in inbound.items() if count == 0]
          assert not missing, "Indexed pages without inbound internal links: " + ", ".join(missing)

          # Ensure the primary regional hub actually links to the Jabodetabek guide.
          hub = Path("rental-mobil-jabodetabek.html").read_text(encoding="utf-8")
          assert 'href="/panduan-rental-mobil-jabodetabek.html"' in hub or 'href="panduan-rental-mobil-jabodetabek.html"' in hub, "Jabodetabek hub missing guide link"

          print(f"SEO graph validated: {len(urls)} sitemap URLs; {len(inbound)} indexed pages checked for inbound links")
          PY

      - name: Validate live public SEO endpoints
        shell: bash
        run: |
          set -euo pipefail
          base="https://transmindnusantararentalmobil.co.id"
          for path in "/" "/robots.txt" "/sitemap.xml" "/rental-mobil-jakarta.html" "/rental-mobil-pariwisata-jabodetabek.html"; do
            code="$(curl -L -sS -o /tmp/tm-seo-body -w "%{http_code}" "$base$path")"
            test "$code" = "200" || { echo "Public endpoint failed: $path -> $code"; exit 1; }
          done
          curl -L -sS "$base/robots.txt" | grep -q "Sitemap: $base/sitemap.xml"
          curl -L -sS "$base/sitemap.xml" | grep -q "$base/"
          echo "Live public SEO endpoints are reachable."

      - name: Validate SEO metadata quality
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          pages=[Path("index.html"), *Path(".").glob("rental-mobil-*.html"), *Path(".").glob("panduan-*.html")]
          for p in pages:
              html=p.read_text(encoding="utf-8")
              title=re.search(r"<title>(.*?)</title>",html,re.S|re.I)
              desc=re.search(r'<meta[^>]+name=["\']description["\'][^>]+content=["\']([^"\']+)["\']',html,re.I)
              canonical=re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)["\']',html,re.I)
              assert title and title.group(1).strip(), f"Missing title: {p}"
              assert 20 <= len(title.group(1).strip()) <= 80, f"Title length out of range: {p}"
              assert desc and 70 <= len(desc.group(1).strip()) <= 220, f"Description length out of range: {p}"
              assert canonical and canonical.group(1).startswith("https://transmindnusantararentalmobil.co.id/"), f"Bad canonical: {p}"
              assert "priceRange" not in html or '"$"' not in html, f"Unverified priceRange found: {p}"
          print(f"SEO metadata quality validated for {len(pages)} pages.")
          PY

