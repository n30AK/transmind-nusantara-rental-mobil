name: Deploy TransMind Nexus to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Submit sitemap URLs to IndexNow
        shell: python
        env:
          INDEXNOW_KEY: "52fdd0dc084fc01a8ffd003a51cf7848"
        run: |
          import json
          import os
          import urllib.request
          import xml.etree.ElementTree as ET

          INDEXNOW_KEY = os.environ["INDEXNOW_KEY"]
          host = "transmindnusantararentalmobil.co.id"
          sitemap = "https://transmindnusantararentalmobil.co.id/sitemap.xml"
          xml = urllib.request.urlopen(sitemap, timeout=30).read()
          root = ET.fromstring(xml)
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text.strip() for node in root.findall("sm:url/sm:loc", ns) if node.text]

          if not urls:
              raise SystemExit("No sitemap URLs found")

          payload = {
              "host": host,
              "key": INDEXNOW_KEY,
              "keyLocation": f"https://{host}/{INDEXNOW_KEY}.txt",
              "urlList": urls[:10000],
          }
          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=data,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  print(f"IndexNow HTTP {response.status}; submitted {len(urls)} URLs")
          except urllib.error.HTTPError as exc:
              # IndexNow can return 200/202/400 depending on validation/state.
              # Do not fail a production deployment merely because the indexing
              # notification is rejected or delayed.
              print(f"IndexNow notification returned HTTP {exc.code}: {exc.read().decode(errors='replace')}")


  seo-smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify public SEO surface
        shell: python
        run: |
          import re
          import urllib.request
          import xml.etree.ElementTree as ET

          base = "https://transmindnusantararentalmobil.co.id"
          urls = [
              "/",
              "/rental-mobil-jakarta.html",
              "/rental-mobil-bekasi.html",
              "/rental-mobil-bogor.html",
              "/rental-mobil-depok.html",
              "/rental-mobil-tangerang.html",
              "/rental-mobil-lepas-kunci-jabodetabek.html",
              "/rental-mobil-dengan-driver-jabodetabek.html",
              "/rental-mobil-corporate-jabodetabek.html",
              "/rental-mobil-wedding-jabodetabek.html",
              "/rental-mobil-pariwisata-jabodetabek.html",
          ]

          def get(path):
              req = urllib.request.Request(base + path, headers={"User-Agent":"Transmind-SEO-Smoke/1.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, r.read().decode("utf-8", errors="replace")

          status, sitemap = get("/sitemap.xml")
          if status != 200:
              raise SystemExit(f"sitemap HTTP {status}")
          root = ET.fromstring(sitemap)
          ns = {"sm":"http://www.sitemaps.org/schemas/sitemap/0.9"}
          sitemap_urls = [x.text.strip() for x in root.findall("sm:url/sm:loc", ns) if x.text]
          if len(sitemap_urls) < 10:
              raise SystemExit(f"sitemap unexpectedly small: {len(sitemap_urls)} URLs")
          print(f"Sitemap OK: {len(sitemap_urls)} URLs")

          status, robots = get("/robots.txt")
          if status != 200 or "Sitemap:" not in robots:
              raise SystemExit("robots.txt missing Sitemap directive")
          print("Robots OK")

          for path in urls:
              status, html = get(path)
              if status != 200:
                  raise SystemExit(f"{path}: HTTP {status}")
              if "<title>" not in html.lower():
                  raise SystemExit(f"{path}: missing title")
              if 'rel="canonical"' not in html.lower():
                  raise SystemExit(f"{path}: missing canonical")
              if "application/ld+json" not in html.lower():
                  raise SystemExit(f"{path}: missing JSON-LD")
              print(f"SEO OK: {path}")

          key_path = "/52fdd0dc084fc01a8ffd003a51cf7848.txt"
          status, key_body = get(key_path)
          if status != 200 or "52fdd0dc084fc01a8ffd003a51cf7848" not in key_body:
              raise SystemExit("IndexNow key verification failed")
          print("IndexNow key OK")
