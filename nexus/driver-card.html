<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transmind Driver Card</title><style>body{margin:0;background:#07080b;color:#f5f5f2;font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}.card{width:min(560px,100%);background:linear-gradient(145deg,#171a21,#0f1116);border:1px solid #2b3039;border-radius:22px;padding:28px;box-sizing:border-box;box-shadow:0 20px 60px #0008}.brand{color:#f0cf68;font-weight:900;letter-spacing:2px;font-size:18px}.sub{color:#8e949f;font-size:10px;letter-spacing:2px;margin-top:5px}.status{display:inline-block;margin-top:22px;border:1px solid #3c3420;background:#17140b;color:#f0cf68;border-radius:999px;padding:7px 10px;font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.item{background:#0b0e13;border:1px solid #272c35;border-radius:12px;padding:13px}.label{color:#8e949f;font-size:10px;text-transform:uppercase}.value{margin-top:5px;font-weight:750}.msg{margin-top:18px;color:#8e949f;line-height:1.55}.bad{color:#e87878}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="card"><div class="brand">TRANSMIND</div><div class="sub">SECURE DRIVER CARD</div><div id="state" class="status">MEMUAT…</div><section id="content" class="grid"></section><div id="msg" class="msg">Memverifikasi kartu perjalanan…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const cfg={url:'https://ynigwuutmqpnfnkhlaip.supabase.co',key:'sb_publishable_VAdOaPHUniU8qRRex4anQQ_46IgVo_C'};const db=supabase.createClient(cfg.url,cfg.key);const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));(async()=>{const token=new URLSearchParams(location.search).get('token');const st=document.getElementById('state'),co=document.getElementById('content'),msg=document.getElementById('msg');if(!token){st.textContent='LINK TIDAK VALID';st.classList.add('bad');msg.textContent='Token Driver Card tidak tersedia.';return}const r=await db.rpc('get_driver_card',{p_token:token});if(r.error||!r.data){st.textContent='KARTU TIDAK TERSEDIA';st.classList.add('bad');msg.textContent=r.error?.message||'Driver Card tidak ditemukan atau sudah kedaluwarsa.';return}const x=Array.isArray(r.data)?r.data[0]:r.data;st.textContent='DRIVER CARD AKTIF';co.innerHTML=[['Booking',x.booking_code],['Layanan',x.service],['Tanggal Mulai',x.start_date],['Tanggal Selesai',x.end_date],['Driver',x.driver_name],['Kendaraan',x.vehicle_name],['Unit',x.unit_code||'—']].map(([a,b])=>`<div class="item"><div class="label">${esc(a)}</div><div class="value">${esc(b||'—')}</div></div>`).join('');msg.textContent='Informasi ini ditampilkan khusus untuk kebutuhan perjalanan. Data sensitif internal tidak ditampilkan.'})().catch(e=>{document.getElementById('state').textContent='GAGAL MEMUAT';document.getElementById('state').classList.add('bad');document.getElementById('msg').textContent=e.message});</script></body></html>
