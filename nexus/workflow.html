<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRANSMIND NEXUS — Workflow</title><style>:root{--bg:#08090b;--p:#15171c;--line:#292c34;--gold:#c9a227;--muted:#92959e;--ok:#72d39a;--bad:#e47b7b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#201b0d,#08090b 42%);color:#f4f4f1;font:14px system-ui}.wrap{max-width:1500px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.gold{color:var(--gold);font-weight:900;letter-spacing:2px}h1{margin:7px 0}.muted{color:var(--muted)}button,input{background:#0e1014;color:#fff;border:1px solid #383b44;border-radius:8px;padding:10px}button{cursor:pointer}button:hover{border-color:var(--gold)}.toolbar{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}.toolbar input{flex:1;min-width:240px}.panel{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:18px}.table{overflow:auto}.row{display:grid;grid-template-columns:170px 1.4fr 1fr 1fr 190px;gap:12px;padding:12px 8px;border-bottom:1px solid var(--line);align-items:center;min-width:950px}.head{color:var(--muted);font-size:11px;text-transform:uppercase}.chip{display:inline-block;padding:4px 8px;border-radius:999px;border:1px solid var(--line);font-size:11px}.overdue{color:var(--bad);border-color:#633737}.open{color:var(--ok)}@media(max-width:700px){.wrap{padding:18px}}</style></head><body><main class="wrap"><div class="top"><div><div class="gold">TRANSMIND NEXUS</div><h1>Workflow Operations Queue</h1><div class="muted">Task operasional yang dihasilkan dari lifecycle booking.</div></div><button id="logout">Logout</button></div><div class="toolbar"><input id="search" placeholder="Cari booking, task, status..."><button id="refresh">Refresh</button><a href="operations.html"><button>Operations</button></a></div><section class="panel"><div id="state" class="muted">Memuat...</div><div class="table"><div class="row head"><span>TASK</span><span>TITLE</span><span>STATUS</span><span>DUE</span><span>ENTITY</span></div><div id="rows"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const cfg=window.NEXUS_CONFIG||{};let sb,all=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=document.getElementById('search').value.trim().toLowerCase();const data=all.filter(r=>JSON.stringify(r).toLowerCase().includes(q));document.getElementById('rows').innerHTML=data.map(r=>`<div class="row"><span><b>${esc(r.task_type)}</b></span><span>${esc(r.title)}</span><span class="chip ${r.queue_state==='OVERDUE'?'overdue':'open'}">${esc(r.queue_state||r.status)}</span><span class="muted">${esc(r.due_at||'—')}</span><span>${esc(r.entity_type)} · ${esc(r.entity_id)}</span></div>`).join('')||'<div class="muted" style="padding:18px">Tidak ada task.</div>'}async function load(){document.getElementById('state').textContent='Memuat workflow...';const{data,error}=await sb.from('nexus_console_workflow_queue').select('*').order('due_at',{ascending:true}).limit(200);if(error){document.getElementById('state').textContent=error.message;return}all=data||[];document.getElementById('state').textContent=all.length+' task operasional';render()}async function boot(){if(!cfg.supabaseUrl||!cfg.supabaseAnonKey||cfg.supabaseAnonKey.includes('YOUR_'))return;sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const s=await sb.auth.getSession();if(!s.data.session){location.href='index.html';return}const{data:a}=await sb.rpc('nexus_my_access');if(!a?.length){location.href='index.html';return}load()}document.getElementById('search').oninput=render;document.getElementById('refresh').onclick=load;document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.href='index.html'};boot();</script></body></html>
