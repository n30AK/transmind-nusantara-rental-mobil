<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRANSMIND NEXUS — Operations</title>
<style>body{margin:0;background:#08090b;color:#f4f4f1;font:14px system-ui}.wrap{max-width:1200px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.gold{color:#c9a227}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}.card{background:#15171c;border:1px solid #292c34;border-radius:14px;padding:18px}button,input{background:#0e1014;color:#fff;border:1px solid #383b44;border-radius:8px;padding:10px}button{cursor:pointer}.row{padding:10px 0;border-bottom:1px solid #292c34}.muted{color:#92959e}.error{color:#e47b7b}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{display:block}}</style>
</head>
<body><main class="wrap">
<div class="top"><div><div class="gold">TRANSMIND NEXUS</div><h1>Operations Console</h1><div class="muted">Secure operational drill-down untuk Booking, Fleet, Customer dan Partner.</div></div><button id="logout">Logout</button></div>
<div class="card" style="margin-top:20px"><div id="state" class="muted">Memuat akses...</div></div>
<div class="grid"><section class="card"><h2>Bookings</h2><div id="bookings" class="muted">—</div></section><section class="card"><h2>Fleet</h2><div id="fleet" class="muted">—</div></section><section class="card"><h2>Customers</h2><div id="customers" class="muted">—</div></section><section class="card"><h2>Partners</h2><div id="partners" class="muted">—</div></section></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
const cfg=window.NEXUS_CONFIG||{};const state=document.getElementById('state');
if(!cfg.supabaseUrl||!cfg.supabaseAnonKey||cfg.supabaseAnonKey.includes('YOUR_')){state.className='error';state.textContent='NEXUS_CONFIG belum dikonfigurasi.';}
else{const sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const render=(id,rows,fields)=>document.getElementById(id).innerHTML=(rows||[]).map(r=>'<div class="row">'+fields.map(f=>'<b>'+esc(r[f])+'</b>').join(' · ')+'</div>').join('')||'<span class="muted">Tidak ada data / tidak berwenang.</span>';
async function load(){const {data:a,error:e}=await sb.rpc('nexus_my_access');if(e||!a?.length){state.className='error';state.textContent='Akses NEXUS tidak tersedia.';return}state.textContent='Authenticated · '+a[0].role_code+' · '+(a[0].full_name||'User');const qs=async(resource,id,fields)=>{const r=await fetch(cfg.supabaseUrl+'/functions/v1/nexus-console-api?resource='+resource,{headers:{apikey:cfg.supabaseAnonKey,Authorization:'Bearer '+(await sb.auth.getSession()).data.session.access_token}});const j=await r.json();if(!r.ok)return;render(id,j.data,fields)};await Promise.all([qs('bookings','bookings',['booking_code','customer_name','status','start_date','end_date']),qs('fleet','fleet',['unit_code','vehicle_type_name','source_type','status']),qs('customers','customers',['customer_code','full_name','status','total_bookings']),qs('partners','partners',['partner_code','name','status','reliability_score'])])}
document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.href='index.html'};const {data}=await sb.auth.getSession();if(data.session)load();else{state.className='error';state.textContent='Silakan login melalui NEXUS Command Center terlebih dahulu.'}}
</script></body></html>
