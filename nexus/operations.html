<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRANSMIND NEXUS — Operations</title>
<style>:root{--bg:#08090b;--p:#15171c;--line:#292c34;--gold:#c9a227;--muted:#92959e;--ok:#72d39a;--bad:#e47b7b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#201b0d,#08090b 42%);color:#f4f4f1;font:14px system-ui}.wrap{max-width:1500px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.gold{color:var(--gold);font-weight:900;letter-spacing:2px}.muted{color:var(--muted)}button,input,select{background:#0e1014;color:#fff;border:1px solid #383b44;border-radius:8px;padding:10px}button{cursor:pointer}button:hover{border-color:var(--gold)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input{flex:1;min-width:240px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button.active{background:#241d08;border-color:var(--gold);color:var(--gold)}.panel{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}.table{overflow:auto}.row{display:grid;grid-template-columns:150px 1.5fr 1fr 1fr 120px;gap:12px;padding:12px 8px;border-bottom:1px solid var(--line);align-items:center;min-width:850px}.head{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px}.click{cursor:pointer}.click:hover{background:#1b1d23}.chip{display:inline-block;padding:4px 8px;border-radius:999px;border:1px solid var(--line);font-size:11px}.ok{color:var(--ok)}.bad{color:var(--bad)}.drawer{position:fixed;inset:0;background:#0009;display:none;justify-content:flex-end;z-index:10}.drawer.open{display:flex}.drawer-card{width:min(560px,100%);height:100%;background:#101216;border-left:1px solid var(--line);padding:24px;overflow:auto}.kv{display:grid;grid-template-columns:150px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}pre{white-space:pre-wrap;word-break:break-word;color:#c9cbd0}@media(max-width:700px){.wrap{padding:18px}.kv{grid-template-columns:1fr}.drawer-card{padding:18px}}</style></head>
<body><main class="wrap">
<div class="top"><div><div class="gold">TRANSMIND NEXUS</div><h1>Operations Console</h1><div class="muted">Secure operational drill-down untuk Booking, Fleet, Customer dan Partner.</div></div><button id="logout">Logout</button></div>
<div class="panel"><div id="state" class="muted">Memuat akses...</div></div>
<div class="toolbar"><div class="tabs" id="tabs"><button data-resource="bookings" class="active">Bookings</button><button data-resource="fleet">Fleet</button><button data-resource="customers">Customers</button><button data-resource="partners">Partners</button></div><input id="search" placeholder="Cari kode, nama, telepon, status..."><button id="refresh">Refresh</button></div>
<section class="panel"><div id="summary" class="muted">—</div><div class="table"><div class="row head"><span>IDENTIFIER</span><span>PRIMARY</span><span>STATUS / TYPE</span><span>DATE / CONTACT</span><span>DETAIL</span></div><div id="rows"><div class="muted" style="padding:18px">—</div></div></div></section>
</main>
<div id="drawer" class="drawer"><div class="drawer-card"><div class="top"><h2 id="drawer-title">Detail</h2><button id="close">Tutup</button></div><div id="detail" style="margin-top:18px"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
const cfg=window.NEXUS_CONFIG||{}, state=document.getElementById('state'), rowsEl=document.getElementById('rows'), summary=document.getElementById('summary');let sb,session,resource='bookings',all=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>s?new Date(s).toLocaleString('id-ID'):'—';
function fields(r){if(resource==='bookings')return [r.booking_code,r.customer_name,r.status,r.start_date+' → '+r.end_date];if(resource==='fleet')return [r.unit_code,r.vehicle_type_name,r.status,r.source_type];if(resource==='customers')return [r.customer_code,r.full_name,r.status,r.phone];return [r.partner_code,r.name,r.status,r.phone];}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const data=all.filter(r=>JSON.stringify(fields(r)).toLowerCase().includes(q));summary.textContent=`${data.length} dari ${all.length} data ditampilkan`;rowsEl.innerHTML=data.map((r,i)=>{const f=fields(r);return `<div class="row click" data-i="${all.indexOf(r)}"><span><b>${esc(f[0])}</b></span><span>${esc(f[1])}</span><span class="chip">${esc(f[2])}</span><span class="muted">${esc(f[3])}</span><span>› Buka</span></div>`}).join('')||'<div class="muted" style="padding:18px">Tidak ada data / tidak berwenang.</div>';document.querySelectorAll('.click').forEach(x=>x.onclick=()=>openDetail(all[Number(x.dataset.i)]));}
function openDetail(r){document.getElementById('drawer-title').textContent=resource.toUpperCase()+' · DETAIL';document.getElementById('detail').innerHTML=Object.entries(r||{}).map(([k,v])=>`<div class="kv"><b>${esc(k)}</b><span>${esc(typeof v==='object'?JSON.stringify(v):v)}</span></div>`).join('');document.getElementById('drawer').classList.add('open');}
async function load(){if(!session)return;state.textContent='Memuat '+resource+'...';const token=(await sb.auth.getSession()).data.session?.access_token;if(!token){location.href='index.html';return}const res=await fetch(cfg.supabaseUrl+'/functions/v1/nexus-console-api?resource='+resource,{headers:{apikey:cfg.supabaseAnonKey,Authorization:'Bearer '+token}});const j=await res.json();if(!res.ok){state.className='bad';state.textContent=j.error||'Akses ditolak.';all=[];render();return}all=j.data||[];state.className='muted';state.textContent='Authenticated · data terlindungi RBAC';render();}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');resource=b.dataset.resource;load()});document.getElementById('search').oninput=render;document.getElementById('refresh').onclick=load;document.getElementById('close').onclick=()=>document.getElementById('drawer').classList.remove('open');document.getElementById('drawer').onclick=e=>{if(e.target.id==='drawer')e.currentTarget.classList.remove('open')};document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.href='index.html'};
async function boot(){if(!cfg.supabaseUrl||!cfg.supabaseAnonKey||cfg.supabaseAnonKey.includes('YOUR_')){state.className='bad';state.textContent='NEXUS_CONFIG belum dikonfigurasi.';return}sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const s=await sb.auth.getSession();session=s.data.session;if(!session){state.className='bad';state.textContent='Silakan login melalui NEXUS Command Center terlebih dahulu.';return}const {data:a}=await sb.rpc('nexus_my_access');if(!a?.length){state.className='bad';state.textContent='Akses NEXUS tidak tersedia.';return}state.textContent='Authenticated · '+a[0].role_code+' · '+(a[0].full_name||'User');load()}
boot();
</script></body></html>
