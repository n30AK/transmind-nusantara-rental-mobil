<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRANSMIND NEXUS — Manual Workspace</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#07080b;--panel:#11141a;--panel2:#171a21;--line:#292e37;--gold:#d2ad32;--gold2:#f0cf68;--text:#f5f5f2;--muted:#8e949f;--bad:#e87878;--ok:#65d49a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 85% -10%,#332b12 0,transparent 55%),var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}.wrap{max-width:1450px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:20px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--gold2);font-weight:800}.title{font-size:30px;font-weight:850;margin:7px 0}.muted{color:var(--muted);font-size:12px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #383d46;background:#0d1015;color:#eee;border-radius:10px;padding:10px 14px;cursor:pointer}.primary{background:var(--gold);border-color:var(--gold);color:#111;font-weight:800}.danger{border-color:#633737;color:#ffadad}.card{margin-top:18px;background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:18px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search{flex:1;min-width:240px;background:#0b0e13;border:1px solid #363b45;color:#fff;border-radius:10px;padding:11px}.table-wrap{overflow:auto;margin-top:14px;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:11px 9px;border-bottom:1px solid #252a31;text-align:left;vertical-align:top}.table th{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.table td{font-size:11px}.table tr.selected{background:#19150b;box-shadow:inset 2px 0 var(--gold)}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:13px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.open{display:flex}.modal-card{width:min(900px,100%);max-height:92vh;overflow:auto;background:#101319;border:1px solid var(--line);border-radius:17px;padding:22px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:15px}.full{grid-column:1/-1}.field label{display:block;font-size:10px;color:#b8bdc6}.field input,.field textarea,.field select{width:100%;margin-top:5px;background:#0b0e13;border:1px solid #363b45;color:#fff;border-radius:9px;padding:10px}.notice{padding:11px 13px;border:1px solid #3c3420;background:#17140b;border-radius:10px;color:#c8c2a7;font-size:11px;margin-top:12px}.notice.ok{border-color:#28543d;color:#9de0b9}.notice.bad{border-color:#633737;color:#ffadad}@media(max-width:700px){.wrap{padding:16px}.top{display:block}.actions{margin-top:15px}.form{grid-template-columns:1fr}.full{grid-column:auto}.title{font-size:24px}}</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">TRANSMIND NEXUS · CONTROLLED DATA ENTRY</div><div id="title" class="title">Manual Workspace</div><div id="meta" class="muted">Memuat konfigurasi...</div></div><div class="actions"><button class="btn" id="back">← Kembali ke NEXUS</button><button class="btn" id="refresh">↻ Refresh</button></div></header><section class="card"><div class="toolbar"><input id="search" class="search" placeholder="Cari record..."><button class="btn primary" id="insert">＋ Insert</button><button class="btn" id="update" disabled>Update</button><button class="btn danger" id="del" disabled>Delete</button><button class="btn" id="undo" disabled>Undo</button></div><div id="msg" class="notice">Menunggu session NEXUS...</div><div class="table-wrap"><table class="table"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><div class="pager"><button class="btn" id="prev" disabled>‹ Back</button><span id="page" class="muted">Page 1</span><button class="btn" id="next" disabled>Next ›</button></div></section></main><div id="modal" class="modal"><div class="modal-card"><div class="top"><div><div class="eyebrow">MANUAL DATA ENTRY</div><div id="formTitle" class="title" style="font-size:22px">Insert</div></div><button class="btn" id="close">×</button></div><div id="form" class="form"></div><div id="formMsg" class="notice"></div><div class="actions" style="margin-top:14px"><button class="btn primary" id="save">Simpan</button><button class="btn" id="cancel">Batal</button></div></div></div><script src="./manual-workspace.js?v=2"></script></body></html>
