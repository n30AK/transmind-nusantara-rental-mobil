<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRANSMIND NEXUS — Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07080b;--panel:#11141a;--line:#272c35;--gold:#d2ad32;--gold2:#f0cf68;--text:#f5f5f2;--muted:#8e949f;--ok:#65d49a;--bad:#e87878}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:grid;place-items:center;padding:24px;background:radial-gradient(900px 500px at 85% -10%,#332b12 0%,transparent 55%),var(--bg)}
.card{width:min(440px,100%);padding:34px;background:linear-gradient(145deg,#1a1d24,#0f1116);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 55px #0007}.brand{font-weight:900;letter-spacing:2px;color:var(--gold2);font-size:20px}.brand small{display:block;font-size:9px;color:var(--muted);letter-spacing:2.5px;margin-top:5px}.intro{color:var(--muted);line-height:1.5;margin:18px 0}.field{margin:15px 0}.field label{display:block;color:#c8ccd4;font-size:12px;margin:0 0 7px}.field input{width:100%;background:#0b0e13;border:1px solid #363b45;color:#fff;border-radius:10px;padding:12px;outline:none}.btn{width:100%;margin-top:8px;padding:12px;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:var(--gold);color:#111;border:1px solid var(--gold)}.secondary{background:#0d1015;color:#e7e8eb;border:1px solid #343943}.msg{min-height:22px;margin-top:13px;font-size:12px;line-height:1.45}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--gold2)}.hidden{display:none!important}.back{display:block;text-align:center;margin-top:16px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main class="card">
  <div class="brand">TRANSMIND NEXUS<small>BUSINESS OPERATING SYSTEM</small></div>
  <div id="requestMode">
    <p class="intro">Gunakan halaman ini untuk meminta link pemulihan password NEXUS.</p>
    <form id="requestForm">
      <div class="field"><label>Email akun NEXUS</label><input id="requestEmail" type="email" autocomplete="username" required></div>
      <button class="btn primary" type="submit">KIRIM LINK PEMULIHAN</button>
    </form>
  </div>
  <div id="updateMode" class="hidden">
    <p class="intro">Link pemulihan valid. Buat password baru untuk akun NEXUS Anda.</p>
    <form id="updateForm">
      <div class="field"><label>Password baru</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></div>
      <div class="field"><label>Ulangi password baru</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div>
      <button class="btn primary" type="submit">SIMPAN PASSWORD BARU</button>
    </form>
  </div>
  <div id="msg" class="msg"></div>
  <a class="back" href="./">Kembali ke NEXUS</a>
</main>
<script>
(function(){
'use strict';
const SUPABASE_URL='https://ynigwuutmqpnfnkhlaip.supabase.co';
const SUPABASE_KEY=['sb_publishable_','MycpkacWOWLwO2gXclp2Cw_ApWaeeAw'].join('');
const RESET_URL='https://transmindnusantararentalmobil.co.id/nexus/reset-password.html';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const setMsg=(t,c)=>{$('msg').className='msg '+(c||'');$('msg').textContent=t};
const showUpdate=()=>{$('requestMode').classList.add('hidden');$('updateMode').classList.remove('hidden')};
async function inspect(){
  const hash=new URLSearchParams(location.hash.replace(/^#/ ,''));
  const error=hash.get('error_description');
  if(error){setMsg(decodeURIComponent(error.replace(/\+/g,' '))+' Silakan minta link baru.','bad');return;}
  const {data:{session}}=await sb.auth.getSession();
  if(session) showUpdate();
}
sb.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY' && session) showUpdate();
});
$('requestForm').addEventListener('submit',async e=>{
  e.preventDefault();setMsg('Mengirim link pemulihan...','warn');
  const {error}=await sb.auth.resetPasswordForEmail($('requestEmail').value.trim(),{redirectTo:RESET_URL});
  if(error){setMsg(error.message,'bad');return;}
  setMsg('Link pemulihan telah dikirim. Buka link terbaru dari email Anda.','ok');
});
$('updateForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const p=$('newPassword').value, c=$('confirmPassword').value;
  if(p.length<8){setMsg('Password minimal 8 karakter.','bad');return;}
  if(p!==c){setMsg('Konfirmasi password tidak sama.','bad');return;}
  setMsg('Menyimpan password baru...','warn');
  const {error}=await sb.auth.updateUser({password:p});
  if(error){setMsg(error.message,'bad');return;}
  await sb.auth.signOut();
  setMsg('Password berhasil diubah. Silakan kembali ke NEXUS dan login dengan password baru.','ok');
  $('updateForm').classList.add('hidden');
});
inspect();
})();
</script>
</body>
</html>
