<style>

.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;overflow:auto;background:rgba(9,11,15,.98);border-right:1px solid var(--line);padding:18px 12px;z-index:20}.side-head{padding:4px 9px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}.side-head .brand{font-size:17px}.side-head .sub{font-size:9px;color:var(--muted);letter-spacing:1.8px;margin-top:5px}.nav-group{margin:15px 5px 5px;color:#676d78;font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.nav-section{margin-bottom:2px}.nav-main{width:100%;display:flex;align-items:center;gap:9px;border:0;background:transparent;color:#c1c5cd;text-align:left;padding:9px 10px;border-radius:9px}.nav-main:hover,.nav-main.open{background:#15181e;color:#fff}.nav-main .arrow{margin-left:auto;color:#666d78;font-size:10px}.nav-section.open>.nav-main{color:var(--gold2)}.submenu{display:none;margin:2px 0 6px 25px;padding-left:9px;border-left:1px solid #252a32}.nav-section.open>.submenu{display:block}.submenu button{width:100%;display:block;border:0;background:transparent;color:#9298a3;text-align:left;padding:7px 8px;border-radius:7px;font-size:12px}.submenu button:hover,.submenu button.active{background:#191c22;color:#fff}.submenu button.active{box-shadow:inset 2px 0 var(--gold);color:var(--gold2)}.userbox{border-top:1px solid var(--line);margin-top:15px;padding:13px 8px;font-size:11px}.userbox b{display:block;margin:5px 0 10px}.userbox button{width:100%}
.main{min-width:0;padding:22px 26px 40px}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);margin-bottom:24px}.crumb{color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px;align-items:center}.status{padding:7px 10px;border-radius:999px;border:1px solid #3b3520;background:#17140b;color:var(--gold2);font-size:11px}.title{font-size:30px;line-height:1.1;font-weight:850;letter-spacing:-.6px;margin:4px 0 7px}.eyebrow{color:var(--gold2);font-size:10px;font-weight:850;letter-spacing:1.8px}.desc{color:var(--muted);max-width:950px;line-height:1.55}.page{display:none}.page.active{display:block}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.hero-actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:0 10px 30px #0002}.k-label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px}.k-value{font-size:25px;font-weight:850;margin:8px 0}.k-note{color:var(--muted);font-size:11px}.split{display:grid;grid-template-columns:1.25fr .75fr;gap:13px;margin-top:13px}.card h3{margin:0 0 13px;font-size:15px}.list{display:grid}.list-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #22262e}.list-row:last-child{border-bottom:0}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:15px 0}.toolbar input{min-width:280px;flex:1;background:#0b0e13;border:1px solid #363b45;color:#fff;border-radius:10px;padding:10px}.table{overflow:auto}.tr{display:grid;grid-template-columns:135px 1.3fr 1fr 1fr 170px;gap:10px;min-width:900px;padding:11px 7px;border-bottom:1px solid #252a31;align-items:center}.th{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.9px}.chip{display:inline-block;width:max-content;border:1px solid #343943;border-radius:999px;padding:4px 8px;font-size:10px}.empty{text-align:center;padding:30px;color:var(--muted)}.notice{padding:13px;border:1px solid #3c3420;background:#17140b;border-radius:11px;color:#c8c2a7}.module-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 15px}.module-tabs button{background:#0d1015;border:1px solid #30353e;color:#aeb3bc;padding:8px 11px;border-radius:9px}.module-tabs button.active{border-color:#68551d;color:var(--gold2);background:#18150c}.workspace{display:grid;grid-template-columns:1.35fr .65fr;gap:13px}.metric-stack{display:grid;gap:8px}.metric-stack .list-row b{font-size:16px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form-full{grid-column:1/-1}.field label{display:block;color:#c6cad1;font-size:11px;margin:0 0 6px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.open{display:flex}.modal-card{width:min(780px,100%);max-height:92vh;overflow:auto;background:#101319;border:1px solid var(--line);border-radius:17px;padding:21px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.mobile-toggle{display:none}
@media(max-width:1100px){.app{grid-template-columns:1fr}.side{position:fixed;left:-310px;width:290px;transition:.2s}.side.mobile-open{left:0}.mobile-toggle{display:block}.grid{grid-template-columns:repeat(2,1fr)}.split,.workspace{grid-template-columns:1fr}}@media(max-width:650px){.main{padding:16px}.topbar{height:52px}.title{font-size:25px}.hero{display:block}.hero-actions{margin-top:13px}.grid,.form-grid{grid-template-columns:1fr}.grid .card{min-height:auto}.toolbar input{min-width:100%}}

<body>
<section id="login" class="login"><div class="login-card"><div class="brand">TRANSMIND NEXUS<small>BUSINESS OPERATING SYSTEM</small></div><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" type="submit">MASUK KE NEXUS</button></form><div id="loginMsg" class="msg muted"></div></div></section>
<div id="app" class="app hidden">
<aside id="side" class="side"><div class="side-head"><div class="brand">TRANSMIND NEXUS</div><div class="sub">BUSINESS OPERATING SYSTEM</div></div><nav id="nav"></nav><div class="userbox"><span id="role" class="muted">AUTHENTICATED</span><b id="who">—</b><button id="logout" class="secondary">Keluar</button></div></aside>
<main class="main"><div class="topbar"><div><button id="mobileToggle" class="iconbtn mobile-toggle">☰</button><span id="breadcrumb" class="crumb">Dashboard / Executive Dashboard</span></div><div class="top-actions"><span id="conn" class="status">● CONNECTING</span></div></div><div id="pages"></div></main></div>
<div id="bookingModal" class="modal"><div class="modal-card"><div class="modal-head"><h2>Booking Baru</h2><button id="closeBooking" class="secondary">Tutup</button></div><form id="bookingForm"><div class="form-grid"><div class="field"><label>Nama Customer *</label><input id="bName" required></div><div class="field"><label>WhatsApp / Telepon *</label><input id="bPhone" required></div><div class="field"><label>Kendaraan *</label><select id="bVehicle" required></select></div><div class="field"><label>Layanan *</label><select id="bService"><option>Self Drive</option><option>Dengan Driver</option><option>Airport Transfer</option><option>Drop Off</option><option>Other</option></select></div><div class="field"><label>Mulai *</label><input id="bStart" type="datetime-local" required></div><div class="field"><label>Selesai *</label><input id="bEnd" type="datetime-local" required></div><div class="field"><label>Area *</label><input id="bArea" value="Jabodetabek" required></div><div class="field"><label>Buffer (menit)</label><input id="bBuffer" type="number" min="0" value="60"></div><div class="field form-full"><label>Catatan</label><textarea id="bNotes" class="field" style="width:100%;min-height:90px;background:#0b0e13;border:1px solid #363b45;color:#fff;border-radius:10px;padding:12px"></textarea></div></div><div id="bookingMsg" class="msg"></div><button class="primary" type="submit">Simpan Booking</button></form></div></div>
<script src="./config.js"></script>
<script>
const cfg=window.NEXUS_CONFIG||{};let sb=null,session=null,currentPage='dashboard';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const rup=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n||0));
const MENU=[
['Management',[['dashboard','Executive Dashboard'],['dashboard-ops','Operational Dashboard'],['dashboard-sales','Sales Dashboard'],['dashboard-finance','Finance Dashboard']]],
['Transaksi',[['booking','Semua Booking'],['booking-new','＋ Booking Baru'],['booking-today','Booking Hari Ini'],['booking-upcoming','Booking Mendatang'],['calendar','Kalender Rental'],['booking-pending','Booking Pending'],['booking-confirmed','Booking Confirmed'],['booking-running','Booking Berjalan'],['booking-completed','Booking Selesai'],['booking-cancelled','Pembatalan'],['booking-refund','Refund']]],
['Armada',[['fleet','Dashboard Armada'],['fleet-types','Data Kendaraan'],['fleet-units','Unit Kendaraan'],['fleet-availability','Ketersediaan'],['fleet-assignment','Assignment'],['fleet-calendar','Kalender Armada'],['fleet-maintenance','Maintenance'],['fleet-service','Service'],['fleet-tax','STNK / Pajak'],['fleet-docs','Dokumen Kendaraan'],['fleet-km','Kilometer'],['fleet-cost','Biaya Kendaraan'],['fleet-util','Utilisasi Armada']]],
['Customer / CRM',[['crm','Customer Dashboard'],['crm-master','Customer Master'],['crm-360','Customer 360'],['crm-history','Riwayat Booking'],['crm-interaction','Interaksi'],['crm-followup','Follow Up'],['crm-lead','Lead'],['crm-prospect','Prospect'],['crm-active','Customer Aktif'],['crm-repeat','Repeat Customer'],['crm-risk','Customer At Risk'],['crm-inactive','Customer Inactive'],['crm-value','Customer Value']]],
['Sales & Marketing',[['sales','Lead Management'],['sales-pipeline','Sales Pipeline'],['sales-campaign','Campaign'],['sales-promo','Promo'],['sales-coupon','Coupon'],['sales-source','Source / Channel'],['sales-wa','WhatsApp Leads'],['sales-conversion','Conversion'],['sales-acquisition','Customer Acquisition'],['sales-performance','Marketing Performance']]],
['Partner',[['partner','Partner Dashboard'],['partner-master','Partner Master'],['partner-fleet','Armada Partner'],['partner-booking','Booking Partner'],['partner-revenue','Partner Revenue'],['partner-commission','Commission'],['partner-settlement','Settlement'],['partner-performance','Partner Performance'],['partner-reliability','Partner Reliability']]],
['Keuangan',[['finance','Finance Dashboard'],['finance-revenue','Pendapatan'],['finance-invoice','Invoice'],['finance-payment','Pembayaran'],['finance-ar','Piutang'],['finance-expense','Pengeluaran'],['finance-cash','Cash Flow'],['finance-pnl','Profit & Loss'],['finance-cost','Cost Center'],['finance-commission','Commission'],['finance-settlement','Settlement'],['finance-reconcile','Rekonsiliasi'],['finance-close','Financial Closing']]],
['Laporan',[['reports','Report Center'],['reports-sales','Laporan Penjualan'],['reports-booking','Laporan Booking'],['reports-fleet','Laporan Armada'],['reports-customer','Laporan Customer'],['reports-partner','Laporan Partner'],['reports-revenue','Laporan Pendapatan'],['reports-expense','Laporan Pengeluaran'],['reports-profit','Laporan Profit'],['reports-ar','Laporan Piutang'],['reports-cash','Laporan Cash Flow'],['reports-commission','Laporan Komisi'],['reports-tax','Laporan Pajak'],['reports-export','Export Excel / PDF']]],
['Forecasting',[['forecast','Forecast Dashboard'],['forecast-booking','Forecast Booking'],['forecast-revenue','Forecast Revenue'],['forecast-demand','Forecast Demand'],['forecast-fleet','Forecast Armada'],['forecast-customer','Forecast Customer'],['forecast-cash','Forecast Cash Flow'],['forecast-target','Target vs Actual'],['forecast-scenario','Scenario Planning'],['forecast-warning','Early Warning']]],
['Business Intelligence',[['bi','Executive BI'],['bi-funnel','Sales Funnel'],['bi-conversion','Conversion Rate'],['bi-booking','Booking Trend'],['bi-revenue','Revenue Trend'],['bi-arv','Average Rental Value'],['bi-util','Utilization Armada'],['bi-unit','Revenue / Unit'],['bi-customer','Revenue / Customer'],['bi-cac','Customer Acquisition Cost'],['bi-repeat','Repeat Rate'],['bi-retention','Retention'],['bi-cancel','Cancellation Rate'],['bi-profit','Profitability'],['bi-channel','Channel Performance']]],
['Operasional',[['operations','Operations Dashboard'],['operations-task','Task'],['operations-workflow','Workflow'],['operations-handover','Handover'],['operations-pickup','Pickup'],['operations-return','Return'],['operations-driver','Driver'],['operations-incident','Incident'],['operations-complaint','Complaint'],['operations-qc','Quality Control']]],
['Procurement & Inventory',[['procurement','Vendor'],['procurement-pr','Purchase Request'],['procurement-po','Purchase Order'],['procurement-spare','Spare Part'],['procurement-inventory','Inventory'],['procurement-stock','Stock Movement'],['procurement-supplier','Supplier Performance']]],
['HR & Organization',[['hr','Employee'],['hr-driver','Driver'],['hr-attendance','Attendance'],['hr-leave','Leave'],['hr-payroll','Payroll'],['hr-performance','Performance'],['hr-org','Organization']]],
['Dokumen',[['documents','Customer Documents'],['documents-vehicle','Vehicle Documents'],['documents-contract','Contract'],['documents-invoice','Invoice'],['documents-receipt','Receipt'],['documents-verification','Document Verification']]],
['AI Intelligence',[['ai','AI Business Advisor'],['ai-revenue','Revenue Advisor'],['ai-fleet','Fleet Advisor'],['ai-customer','Customer Advisor'],['ai-sales','Sales Advisor'],['ai-finance','Financial Advisor'],['ai-anomaly','Anomaly Detection'],['ai-actions','Recommended Actions']]],
['Admin',[['admin','User'],['admin-role','Role & Permission'],['admin-org','Organization'],['admin-branch','Branch'],['admin-system','System Setting'],['admin-pricing','Pricing Setting'],['admin-notification','Notification Setting'],['admin-integration','Integration'],['admin-api','API'],['admin-audit','Audit Log']]]
];
const ICONS=['🏠','📥','🚗','👥','📢','🤝','💰','📊','🔮','📈','⚙️','📦','👨‍💼','📁','🤖','⚙️'];
const META={
'dashboard':['Executive Dashboard','Command Center','Keputusan bisnis dari data transaksi, operasi, keuangan dan forecast.'],'dashboard-ops':['Operational Dashboard','Dashboard','Kendali pekerjaan dan kesiapan operasional.'],'dashboard-sales':['Sales Dashboard','Dashboard','Pipeline, conversion dan sumber transaksi.'],'dashboard-finance':['Finance Dashboard','Dashboard','Pendapatan, collection, expense dan posisi kas.'],
'booking':['Semua Booking','Transaksi','Kelola seluruh booking dan status transaksi.'],'booking-new':['Booking Baru','Transaksi','Buat transaksi baru melalui workflow booking resmi.'],'calendar':['Kalender Rental','Transaksi','Jadwal rental dan pemantauan konflik waktu.'],
'fleet':['Dashboard Armada','Armada','Ketersediaan, kondisi, assignment dan utilisasi armada.'],'crm':['Customer Dashboard','Customer / CRM','Customer Master, lifecycle dan customer value.'],'sales':['Lead Management','Sales & Marketing','Demand, lead dan pipeline penjualan.'],'partner':['Partner Dashboard','Partner','Supply partner, booking, revenue dan settlement.'],'finance':['Finance Dashboard','Keuangan','Kontrol pendapatan, pembayaran, piutang, expense dan cash flow.'],'reports':['Report Center','Laporan','Pusat laporan bisnis dengan periode dan export.'],'forecast':['Forecast Dashboard','Forecasting','Forecast booking, revenue, demand, fleet, customer dan cash flow.'],'bi':['Executive BI','Business Intelligence','Analitik untuk memahami kinerja dan kualitas bisnis.'],'operations':['Operations Dashboard','Operasional','Work center untuk task, workflow dan eksekusi lapangan.'],'procurement':['Vendor','Procurement & Inventory','Pengadaan, vendor, spare part dan inventory.'],'hr':['Employee','HR & Organization','Data organisasi dan tenaga kerja.'],'documents':['Customer Documents','Dokumen','Dokumen customer, kendaraan dan transaksi.'],'ai':['AI Business Advisor','AI Intelligence','Decision support, anomaly dan recommended actions.'],'admin':['User','Admin','Kontrol akses, konfigurasi dan audit.']};
function buildNav(){const nav=$('nav');nav.innerHTML=MENU.map((g,i)=>`<div class="nav-section" data-group="${i}"><button class="nav-main" type="button"><span>${ICONS[i]}</span><span>${g[0]}</span><span class="arrow">›</span></button><div class="submenu">${g[1].map(([id,label])=>`<button data-page="${id}" type="button">${esc(label)}</button>`).join('')}</div></div>`).join('');document.querySelectorAll('.nav-main').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));document.querySelectorAll('.submenu button').forEach(b=>b.onclick=()=>{showPage(b.dataset.page);$('side').classList.remove('mobile-open')});document.querySelector('.nav-section')?.classList.add('open')}
function pageMeta(id){if(META[id])return META[id];const parts=id.split('-');let group=MENU.find(g=>g[1].some(x=>x[0]===id));let label=group?.[1].find(x=>x[0]===id)?.[1]||id;return [label,group?.[0]||'NEXUS',`Workspace ${label} dalam modul ${group?.[0]||'NEXUS'}.`]}
function shell(id){const [title,group,desc]=pageMeta(id);return `<section id="page-${id}" class="page"><div class="hero"><div><div class="eyebrow">${esc(group)}</div><div class="title">${esc(title)}</div><div class="desc">${esc(desc)}</div></div><div class="hero-actions">${id==='booking'?'<button class="primary" onclick="openBooking()">＋ Booking Baru</button>':''}<button class="secondary" onclick="refreshCurrent()">↻ Refresh</button></div></div><div id="content-${id}"></div></section>`}
function buildPages(){const ids=MENU.flatMap(g=>g[1].map(x=>x[0]));$('pages').innerHTML=ids.map(shell).join('')}
function activateNav(id){document.querySelectorAll('.submenu button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));const btn=document.querySelector(`.submenu button[data-page="${CSS.escape(id)}"]`);if(btn){const sec=btn.closest('.nav-section');document.querySelectorAll('.nav-section').forEach(x=>x.classList.remove('open'));sec.classList.add('open')}}
function showPage(id){currentPage=id;document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+id));activateNav(id);const [title,group]=pageMeta(id);$('breadcrumb').textContent=group+' / '+title;loadPage(id)}
async function read(view,limit=500){const r=await sb.from(view).select('*').limit(limit);if(r.error)throw r.error;return r.data||[]}
function cards(items){return `<div class="grid">${items.map(x=>`<div class="card"><div class="k-label">${esc(x[0])}</div><div class="k-value">${x[1]}</div><div class="k-note">${esc(x[2]||'')}</div></div>`).join('')}</div>`}
async function dashboard(id){let r={};try{r=(await read('nexus_business_report',1))[0]||{}}catch(e){}const content=$('content-'+id);if(id==='dashboard'){$('conn').textContent='● ONLINE';$('conn').className='status ok';content.innerHTML=cards([['Booking Aktif',r.bookings_open??'—','Transaksi aktif'],['Revenue Billed',rup(r.billed_revenue),'Nilai tagihan'],['Cash Collected',rup(r.cash_collected),'Kas terkumpul'],['Fleet Available',r.fleet_total!=null?`${r.fleet_available||0} / ${r.fleet_total}`:'—','Available / total']])+`<div class="split"><div class="card"><h3>Business Pulse</h3><div class="list">${[['Completed',r.bookings_completed],['Cancelled',r.bookings_cancelled],['Waiting Assignment',r.bookings_waiting_assignment],['Maintenance',r.fleet_maintenance]].map(x=>`<div class="list-row"><span>${x[0]}</span><b>${x[1]??'—'}</b></div>`).join('')}</div></div><div class="card"><h3>Action Required</h3><div class="list">${[['Booking belum assignment',r.bookings_waiting_assignment],['Task terbuka',r.open_tasks],['Notification pending',r.pending_notifications],['Unit maintenance',r.fleet_maintenance]].map(x=>`<div class="list-row"><span>${x[0]}</span><b class="${Number(x[1])?'warn':'ok'}">${x[1]??'—'}</b></div>`).join('')}</div></div></div>`}else if(id==='dashboard-ops')await operationsContent(content);else if(id==='dashboard-sales')await salesContent(content);else await financeContent(content)}
async function operationsContent(el){let d=[];try{d=await read('nexus_console_workflow_queue')}catch(e){}el.innerHTML=cards([['Open Task',d.filter(x=>x.status==='OPEN').length,'Workflow queue'],['In Progress',d.filter(x=>x.status==='IN_PROGRESS').length,'Sedang dikerjakan'],['Urgent',d.filter(x=>x.priority==='URGENT').length,'Prioritas tertinggi'],['Total Queue',d.length,'Task terlihat']])+`<div class="card" style="margin-top:13px"><h3>My Work / Workflow Queue</h3><div class="list">${d.slice(0,12).map(x=>`<div class="list-row"><span><b>${esc(x.title)}</b><br><small class="muted">${esc(x.task_type)} · ${esc(x.due_at||'')}</small></span><span class="chip">${esc(x.status)}</span></div>`).join('')||'<div class="empty">Tidak ada task.</div>'}</div></div>`}
async function salesContent(el){let f={};try{f=(await read('nexus_sales_funnel',1))[0]||{}}catch(e){}el.innerHTML=cards([['Demand',f.demand_total??'—','Total demand'],['Converted',f.demand_converted??'—','Demand menjadi booking'],['Booking',f.booking_total??'—','Booking terkait funnel'],['Conversion Rate',f.conversion_rate!=null?Number(f.conversion_rate).toFixed(1)+'%':'—','Indikator konversi']])+`<div class="notice" style="margin-top:13px">Gunakan submenu Sales & Marketing untuk masuk ke Lead Management, Pipeline, Campaign, Promo, Source/Channel dan performance.</div>`}
async function financeContent(el){let r={};try{r=(await read('nexus_business_report',1))[0]||{}}catch(e){}el.innerHTML=cards([['Billed Revenue',rup(r.billed_revenue),'Pendapatan ditagihkan'],['Cash Collected',rup(r.cash_collected),'Pembayaran diterima'],['Operating Expense',rup(r.operating_expense),'Biaya operasi'],['Open Payments',r.payments_open??'—','Pembayaran belum selesai']])+`<div class="split"><div class="card"><h3>Financial Snapshot</h3><div class="list">${[['Net Cash Snapshot',rup(Number(r.cash_collected||0)-Number(r.operating_expense||0))],['Booking Revenue',rup(r.billed_revenue)],['Collection',rup(r.cash_collected)]].map(x=>`<div class="list-row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></div><div class="notice">Keuangan menggunakan data backend yang tersedia. CRUD finance tetap mengikuti permission dan workflow transaksi.</div></div>`}
async function bookingContent(id,el){let data=[];try{data=await read('nexus_console_booking_360')}catch(e){}let filtered=data;const status=id==='booking-pending'?'PENDING':id==='booking-confirmed'?'CONFIRMED':id==='booking-running'?'RUNNING':id==='booking-completed'?'COMPLETED':id==='booking-cancelled'?'CANCELLED':null;if(status)filtered=data.filter(x=>x.status===status);if(id==='booking-today'){const t=new Date().toISOString().slice(0,10);filtered=data.filter(x=>String(x.start_date).slice(0,10)===t)}if(id==='booking-upcoming'){const t=new Date().toISOString().slice(0,10);filtered=data.filter(x=>String(x.start_date)>=t)}el.innerHTML=`<div class="card"><div class="toolbar"><input id="bookingSearch" placeholder="Cari booking, customer, telepon..."><button class="secondary" onclick="loadPage(currentPage)">Refresh</button></div><div id="bookingTable" class="table"><div class="tr th"><span>CODE</span><span>CUSTOMER</span><span>STATUS</span><span>PERIODE</span><span>ACTION</span></div>${filtered.map(x=>`<div class="tr"><b>${esc(x.booking_code)}</b><span>${esc(x.customer_master_name||x.customer_name)}<br><small class="muted">${esc(x.customer_phone||'')}</small></span><span class="chip">${esc(x.status)}</span><span>${esc(x.start_date)} → ${esc(x.end_date)}</span><span><button class="secondary" onclick='showDetail(${JSON.stringify(x).replace(/'/g,"&#39;")})'>Detail</button></span></div>`).join('')||'<div class="empty">Tidak ada booking pada filter ini.</div>'}</div></div>`;const inp=$('bookingSearch');if(inp)inp.oninput=()=>{const q=inp.value.toLowerCase();document.querySelectorAll('#bookingTable .tr:not(.th)').forEach(row=>row.style.display=row.textContent.toLowerCase().includes(q)?'grid':'none')}}
async function calendarContent(el){let d=[];try{d=await read('nexus_console_booking_360')}catch(e){}d.sort((a,b)=>String(a.start_at||a.start_date).localeCompare(String(b.start_at||b.start_date)));el.innerHTML=`<div class="card"><h3>Rental Calendar</h3><div class="list">${d.map(x=>`<div class="list-row"><span><b>${esc(x.start_date)} → ${esc(x.end_date)}</b><br><small class="muted">${esc(x.customer_master_name||x.customer_name)} · ${esc(x.booking_code)}</small></span><span class="chip">${esc(x.status)}</span></div>`).join('')||'<div class="empty">Tidak ada booking.</div>'}</div></div>`}
async function fleetContent(el){let d=[];try{d=await read('nexus_console_fleet')}catch(e){}const count=k=>d.filter(x=>x.status===k).length;el.innerHTML=cards([['Total Unit',d.length,'Vehicle units'],['Available',count('AVAILABLE'),'Siap disewakan'],['Rented',count('RENTED'),'Sedang rental'],['Maintenance',count('MAINTENANCE'),'Dalam perawatan']])+`<div class="card" style="margin-top:13px"><div class="toolbar"><span class="muted">Fleet Console</span></div><div class="table"><div class="tr th"><span>UNIT</span><span>VEHICLE</span><span>STATUS</span><span>SOURCE</span><span>TAHUN</span></div>${d.map(x=>`<div class="tr"><b>${esc(x.unit_code)}</b><span>${esc(x.vehicle_type_name)}</span><span class="chip">${esc(x.status)}</span><span>${esc(x.source_type)}</span><span>${esc(x.manufacture_year||'—')}</span></div>`).join('')||'<div class="empty">Data armada belum tersedia pada scope user.</div>'}</div></div>`}
async function crmContent(el){let d=[];try{d=await read('nexus_console_customers')}catch(e){}el.innerHTML=cards([['Customer Master',d.length,'Customer bisnis tersinkron'],['Aktif',d.filter(x=>x.status==='ACTIVE').length,'Lifecycle aktif'],['Repeat',d.filter(x=>Number(x.total_bookings||0)>1).length,'Booking ≥ 2'],['Customer Value',rup(d.reduce((a,x)=>a+Number(x.total_revenue||0),0)),'Total revenue tercatat']])+`<div class="card" style="margin-top:13px"><div class="toolbar"><input id="customerSearch" placeholder="Cari customer / telepon..."><button class="secondary" onclick="loadPage(currentPage)">Refresh</button></div><div class="table"><div class="tr th"><span>CODE</span><span>CUSTOMER</span><span>STATUS</span><span>BOOKING</span><span>VALUE</span></div>${d.map(x=>`<div class="tr"><b>${esc(x.customer_code)}</b><span>${esc(x.full_name)}<br><small class="muted">${esc(x.phone||'')}</small></span><span class="chip">${esc(x.status)}</span><span>${x.total_bookings||0}</span><span>${rup(x.total_revenue)}</span></div>`).join('')||'<div class="empty">Customer Master belum memiliki customer bisnis. Booking test lama tidak dibackfill.</div>'}</div></div>`}
async function partnerContent(el){let d=[];try{d=await read('nexus_console_partners')}catch(e){}el.innerHTML=`<div class="card"><div class="table"><div class="tr th"><span>CODE</span><span>PARTNER</span><span>STATUS</span><span>PHONE</span><span>RELIABILITY</span></div>${d.map(x=>`<div class="tr"><b>${esc(x.partner_code)}</b><span>${esc(x.name)}</span><span class="chip">${esc(x.status)}</span><span>${esc(x.phone||'')}</span><span>${esc(x.reliability_score??'—')}</span></div>`).join('')||'<div class="empty">Belum ada partner.</div>'}</div></div>`}
async function reportContent(el){let d=[];try{d=await read('nexus_business_daily',400)}catch(e){}const rows=d.slice(-30);el.innerHTML=`<div class="toolbar"><select id="reportPeriod" class="secondary"><option value="7">7 Hari</option><option value="30" selected>30 Hari</option><option value="90">90 Hari</option></select><button class="primary" onclick="loadPage(currentPage)">Tampilkan</button></div><div class="card"><div class="table"><div class="tr th"><span>DATE</span><span>BOOKING</span><span>CONFIRMED</span><span>COMPLETED</span><span>CASH</span></div>${rows.map(x=>`<div class="tr"><b>${esc(x.report_date)}</b><span>${x.bookings??0}</span><span>${x.confirmed??0}</span><span>${x.completed??0}</span><span>${rup(x.paid_amount)}</span></div>`).join('')||'<div class="empty">Belum ada data laporan.</div>'}</div></div>`}
async function forecastContent(el){let r={};try{r=(await read('nexus_forecast',1))[0]||{}}catch(e){}el.innerHTML=cards([['Forecast Booking 7 Hari',r.forecast_bookings_7d??'—','Projection'],['Forecast Booking 30 Hari',r.forecast_bookings_30d??'—','Projection'],['Forecast Revenue 7 Hari',rup(r.forecast_revenue_7d),'Projection'],['Confidence',r.forecast_confidence||'LOW_DATA','Kualitas data']])+`<div class="split"><div class="card"><h3>Target vs Actual</h3><div class="list">${[['Pipeline 30 Hari',r.pipeline_30d],['Booking 7 Hari Historis',r.bookings_7d],['History 28 Hari',r.bookings_28d]].map(x=>`<div class="list-row"><span>${x[0]}</span><b>${x[1]??'—'}</b></div>`).join('')}</div></div><div class="notice">${esc((r.forecast_confidence||'LOW_DATA')+' · '+(r.methodology||'Forecast akan ditingkatkan ketika data historis bertambah.'))}</div></div>`}
async function biContent(el){let f={},fl={};try{f=(await read('nexus_sales_funnel',1))[0]||{};fl=(await read('nexus_fleet_bi',1))[0]||{}}catch(e){}el.innerHTML=cards([['Demand',f.demand_total??'—','Sales funnel'],['Converted',f.demand_converted??'—','Demand → booking'],['Booking',f.booking_total??'—','Booking total'],['Fleet Utilization',fl.current_utilization_pct!=null?Number(fl.current_utilization_pct).toFixed(1)+'%':'—','Scope org aktif']])+`<div class="split"><div class="card"><h3>Sales Funnel</h3><div class="list">${[['Demand Pipeline',f.demand_pipeline],['Demand Converted',f.demand_converted],['Demand Lost',f.demand_lost],['Completed Booking',f.booking_completed]].map(x=>`<div class="list-row"><span>${x[0]}</span><b>${x[1]??'—'}</b></div>`).join('')}</div></div><div class="card"><h3>Fleet Intelligence</h3><div class="list">${[['Total',fl.fleet_total],['Available',fl.available],['Booked',fl.booked],['Rented',fl.rented],['Maintenance',fl.maintenance]].map(x=>`<div class="list-row"><span>${x[0]}</span><b>${x[1]??'—'}</b></div>`).join('')}</div></div></div>`}
async function operationsPage(el){return operationsContent(el)}
async function genericContent(id,el){const [title,group]=pageMeta(id);let map={procurement:['purchase_requests','Purchase Request'],documents:['documents','Documents'],ai:['advice_events','Advice Events'],admin:['audit_log','Audit Log'],hr:['profiles','Employee']};let base=id.split('-')[0];if(map[base]){let n=0;try{const {count}=await sb.from(map[base][0]).select('*',{count:'exact',head:true});n=count||0}catch(e){}el.innerHTML=cards([[map[base][1],n,'Data yang dapat diakses'],['Status','CONNECTED','Backend foundation'],['Action','READY','Workspace']])+`<div class="notice" style="margin-top:13px">Halaman <b>${esc(title)}</b> sudah menjadi bagian dari struktur aplikasi. CRUD khusus modul ini mengikuti permission, schema dan workflow backend agar tidak menghasilkan transaksi palsu.</div>`}else{el.innerHTML=`<div class="workspace"><div class="card"><h3>${esc(title)}</h3><div class="notice">Modul ini sudah tersedia dalam navigasi NEXUS dan siap dihubungkan ke data/workflow backend terkait. Tidak ada angka fiktif yang ditampilkan.</div></div><div class="card"><h3>Module Status</h3><div class="metric-stack"><div class="list-row"><span>Module</span><b>READY</b></div><div class="list-row"><span>RBAC</span><b>ENABLED</b></div><div class="list-row"><span>Data Integrity</span><b>PROTECTED</b></div></div></div></div>`}}
async function loadPage(id){try{const el=$('content-'+id);if(!el)return;if(id.startsWith('dashboard'))return dashboard(id);if(id.startsWith('booking'))return bookingContent(id,el);if(id==='calendar')return calendarContent(el);if(id.startsWith('fleet'))return fleetContent(el);if(id.startsWith('crm'))return crmContent(el);if(id.startsWith('partner'))return partnerContent(el);if(id.startsWith('finance'))return financeContent(el);if(id.startsWith('reports'))return reportContent(el);if(id.startsWith('forecast'))return forecastContent(el);if(id.startsWith('bi'))return biContent(el);if(id.startsWith('operations'))return operationsPage(el);return genericContent(id,el)}catch(e){console.error(e);$('content-'+id).innerHTML=`<div class="notice bad">Gagal memuat modul: ${esc(e.message)}</div>`}}
async function access(){const {data,error}=await sb.rpc('nexus_my_access');if(error||!data?.length)throw new Error('Akses NEXUS tidak tersedia');$('role').textContent=data[0].role_code||'AUTHENTICATED';$('who').textContent=data[0].full_name||session.user.email}
async function openBooking(){const r=await sb.from('vehicle_types').select('id,name').eq('active',true).order('sort_order').order('name');if(r.error){alert(r.error.message);return}$('bVehicle').innerHTML=(r.data||[]).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');const now=new Date(),later=new Date(now.getTime()+86400000);$('bStart').value=now.toISOString().slice(0,16);$('bEnd').value=later.toISOString().slice(0,16);$('bookingModal').classList.add('open')}
function showDetail(x){alert(JSON.stringify(x,null,2))}
async function refreshCurrent(){await loadPage(currentPage)}
$('nav')?.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)showPage(b.dataset.page)});$('mobileToggle').onclick=()=>$('side').classList.toggle('mobile-open');$('closeBooking').onclick=()=>$('bookingModal').classList.remove('open');$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='Mengautentikasi...';const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){$('loginMsg').textContent=r.error.message;$('loginMsg').className='msg bad';return}location.reload()};$('bookingForm').onsubmit=async e=>{e.preventDefault();$('bookingMsg').textContent='Menyimpan booking...';try{const {data,error}=await sb.rpc('create_booking_v2',{p_customer_name:$('bName').value,p_customer_phone:$('bPhone').value,p_vehicle_type_id:$('bVehicle').value,p_service:$('bService').value,p_start_at:new Date($('bStart').value).toISOString(),p_end_at:new Date($('bEnd').value).toISOString(),p_area:$('bArea').value,p_notes:$('bNotes').value||null,p_customer_user_id:null,p_buffer_minutes:Number($('bBuffer').value||60)});if(error)throw error;const r=Array.isArray(data)?data[0]:data;if(!r?.success)throw new Error(r?.message||'Booking gagal');$('bookingMsg').textContent='Berhasil: '+r.booking_code;$('bookingMsg').className='msg ok';setTimeout(()=>{$('bookingModal').classList.remove('open');showPage('booking')},700)}catch(err){$('bookingMsg').textContent=err.message;$('bookingMsg').className='msg bad'}};
async function boot(){buildNav();buildPages();if(!cfg.supabaseUrl||!cfg.supabaseAnonKey){$('loginMsg').textContent='NEXUS_CONFIG belum dikonfigurasi.';return}sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const s=await sb.auth.getSession();session=s.data.session;if(!session)return;$('login').classList.add('hidden');$('app').classList.remove('hidden');try{await access();showPage('dashboard')}catch(e){$('conn').textContent='● '+e.message;$('conn').className='status bad'}}boot();
</script>
</body></html>
