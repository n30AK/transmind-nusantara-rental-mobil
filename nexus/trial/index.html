<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TransMind Nexus — Trial 7 Hari</title>
<meta name="description" content="Trial TransMind Nexus selama 7 hari tanpa login. Uji AI Customer Service, lead follow-up dan booking conversion.">
<style>
:root{--bg:#06070a;--panel:#101319;--panel2:#151920;--line:#292f39;--gold:#e0bd4d;--gold2:#f4d978;--text:#f6f6f2;--muted:#9299a5;--ok:#6bd6a0;--bad:#ef7e7e;--blue:#83aaff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(900px 500px at 80% -10%,#3a3010 0,transparent 55%),var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:18px 0;border-bottom:1px solid var(--line)}.brand{font-weight:950;letter-spacing:2px;color:var(--gold2)}.brand small{display:block;font-size:9px;color:var(--muted);letter-spacing:2px;margin-top:4px}.trial{border:1px solid #5d4d1c;background:#18150c;color:var(--gold2);border-radius:999px;padding:8px 12px;font-size:11px;font-weight:800}
.hero{padding:42px 0 28px;display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:stretch}.eyebrow{font-size:10px;font-weight:900;letter-spacing:2px;color:var(--gold2)}h1{font-size:clamp(34px,5vw,62px);line-height:.98;letter-spacing:-2px;margin:10px 0 15px}.hero p{color:var(--muted);font-size:16px;line-height:1.65;max-width:760px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.primary,.secondary{border-radius:11px;padding:12px 16px;font-weight:850}.primary{background:var(--gold);color:#111;border:1px solid var(--gold)}.secondary{background:#0c0f14;color:#e9eaed;border:1px solid #353b45}
.card{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 18px 55px #0005}.timer{display:flex;justify-content:space-between;align-items:center;gap:15px}.days{font-size:38px;font-weight:950;color:var(--gold2)}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:13px 0}.k{font-size:25px;font-weight:900;margin:7px 0}.label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.section{margin:28px 0}.section h2{margin:0 0 7px;font-size:24px}.section>p{color:var(--muted);line-height:1.55}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.feature h3{margin:0 0 8px}.feature p{color:var(--muted);line-height:1.55;margin:0}.chat{display:grid;grid-template-columns:.85fr 1.15fr;gap:13px}.chatbox{height:480px;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:6px 2px;display:grid;gap:10px}.bubble{max-width:88%;padding:11px 13px;border-radius:13px;line-height:1.5;white-space:pre-wrap}.ai{background:#171b22;border:1px solid #303640;justify-self:start}.me{background:#29230f;border:1px solid #5a4a1b;justify-self:end}.composer{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px}.composer input{flex:1;background:#0a0d12;border:1px solid #353b45;color:#fff;border-radius:10px;padding:12px}.lead{display:grid;gap:10px}.lead input{width:100%;background:#0a0d12;border:1px solid #353b45;color:#fff;border-radius:10px;padding:11px}.check{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:11px;line-height:1.45}.notice{padding:12px;border:1px solid #3a3420;background:#17140b;border-radius:11px;color:#cfc7a9}.status{font-size:11px;margin-top:8px;min-height:18px}.ok{color:var(--ok)}.bad{color:var(--bad)}footer{padding:30px 0 45px;color:var(--muted);font-size:11px;border-top:1px solid var(--line);margin-top:30px}
.lock{min-height:80vh;display:grid;place-items:center}.lock .card{text-align:center;width:min(560px,100%)}.lock h1{font-size:34px;letter-spacing:-1px}
@media(max-width:800px){.hero,.chat{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.features{grid-template-columns:1fr}.chatbox{height:520px}}@media(max-width:520px){.wrap{width:min(100% - 20px,1180px)}.top{align-items:flex-start}.trial{font-size:10px}.grid{grid-template-columns:1fr 1fr}.hero{padding-top:28px}h1{font-size:39px}.bubble{max-width:94%}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY="transmind_nexus_trial_v1";
const SB_URL="https://ynigwuutmqpnfnkhlaip.supabase.co";
const SB_KEY="sb_publishable_MycpkacWOWLwO2gXclp2Cw_ApWaeeAw";
const TRIAL_MS=7*24*60*60*1000;
let trial=null,chat=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function getTrial(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(_){return null}}
function startTrial(){const now=Date.now();trial={startedAt:now,expiresAt:now+TRIAL_MS,sessionId:(crypto.randomUUID?crypto.randomUUID():"trial-"+now+"-"+Math.random().toString(36).slice(2)),messages:0};localStorage.setItem(KEY,JSON.stringify(trial));render()}
function active(){return trial&&Date.now()<trial.expiresAt}
function remaining(){return Math.max(0,trial.expiresAt-Date.now())}
function fmt(ms){const d=Math.floor(ms/86400000),h=Math.floor(ms%86400000/3600000),m=Math.floor(ms%3600000/60000);return d+" hari "+h+" jam "+m+" menit"}
function shell(body){document.getElementById("app").innerHTML='<div class="wrap"><header class="top"><div class="brand">TRANSMIND NEXUS<small>BUSINESS OPERATING SYSTEM · TRIAL</small></div><div class="trial" id="timer">TRIAL 7 HARI</div></header>'+body+'<footer>Trial tanpa login · Data operasional internal tidak dibuka pada mode trial · Percakapan yang secara eksplisit dikirim sebagai lead dapat masuk ke alur Customer Care TransMind.</footer></div>';tick()}
function tick(){const el=document.getElementById("timer");if(!el)return;if(active()){el.textContent="TRIAL · "+fmt(remaining())}else{el.textContent="TRIAL BERAKHIR"}}
function render(){
 trial=getTrial();
 if(!trial){shell('<main class="hero"><section><div class="eyebrow">NEXUS · NO LOGIN TRIAL</div><h1>Coba TransMind Nexus selama 7 hari.</h1><p>Masuk tanpa email dan password untuk mencoba alur yang paling penting: AI Customer Service, lead capture, follow-up, handoff ke admin, dan dorongan menuju real booking.</p><div class="actions"><button class="primary" onclick="startTrial()">Mulai Trial 7 Hari</button></div><div class="notice" style="margin-top:18px">Mode trial tidak membuka data keuangan, CRM internal, user/role, atau transaksi internal. Trial dirancang sebagai ruang uji aman untuk mesin pertumbuhan dan customer care.</div></section><aside class="card"><div class="label">Yang diuji</div><div class="k">Visitor → CTA → Lead → Follow-up → Booking</div><p class="muted">Fokus trial adalah satu sasaran bisnis: memperbaiki jalur konversi sampai booking nyata.</p></aside></main>');return}
 if(!active()){shell('<main class="lock"><div class="card"><div class="eyebrow">TRIAL SELESAI</div><h1>Masa trial 7 hari telah berakhir.</h1><p class="muted">Mode trial ini tidak lagi dapat digunakan pada browser ini. Akses operasional NEXUS tetap menggunakan jalur login internal.</p></div></main>');return}
 shell('<main><section class="hero"><section><div class="eyebrow">NEXUS TRIAL · '+esc(trial.sessionId.slice(0,8).toUpperCase())+'</div><h1>Demand harus berakhir di booking.</h1><p>Ini adalah ruang uji Customer Care dan Conversion Engine TransMind. Anda dapat berbicara dengan AI, memberi identitas secara sukarela, lalu menguji bagaimana peluang diteruskan ke admin dan follow-up.</p><div class="actions"><a class="primary" style="text-decoration:none" href="https://transmindnusantararentalmobil.co.id/" target="_blank">Lihat Website TransMind</a><button class="secondary" onclick="document.getElementById('chatInput').focus()">Coba AI Customer Service</button></div></section><aside class="card timer"><div><div class="label">Sisa trial</div><div class="days" id="days">—</div><div class="muted">akses trial browser ini</div></div><div style="text-align:right"><div class="label">Target kerja</div><b>Booking = 50 / hari</b><br><span class="muted">ukur dari CTA → real booking</span></div></aside></section>
<section class="grid"><div class="card"><div class="label">Visitor</div><div class="k">19</div><div class="muted">observasi terakhir yang Anda lihat</div></div><div class="card"><div class="label">WhatsApp CTA</div><div class="k">4</div><div class="muted">peluang komunikasi</div></div><div class="card"><div class="label">Booking CTA</div><div class="k">32</div><div class="muted">niat booking terdeteksi</div></div><div class="card"><div class="label">Booking</div><div class="k">0</div><div class="muted">titik yang harus kita perbaiki</div></div></section>
<section class="section"><h2>AI Customer Service Growth Loop</h2><p>AI tidak hanya menjawab. Ketika calon pelanggan memberikan nama, WhatsApp dan persetujuan, konteks dapat diteruskan ke alur Customer Care untuk follow-up. Untuk keputusan khusus seperti refund, komplain, pembatalan, harga khusus, atau ketersediaan pasti, AI menyerahkan keputusan kepada manusia.</p><div class="features"><div class="card feature"><h3>🤝 Percakapan natural</h3><p>Bahasa ramah dan kontekstual, bukan gaya jawaban robotik.</p></div><div class="card feature"><h3>⏱ Follow-up</h3><p>Lead yang setuju dapat masuk antrean follow-up bertahap dan task admin.</p></div><div class="card feature"><h3>🧠 Learning loop</h3><p>Outcome percakapan dan booking menjadi sinyal pembelajaran untuk perbaikan alur.</p></div></div></section>
<section class="chat"><aside class="card"><h3>Identitas calon pelanggan</h3><p class="muted">Tidak wajib untuk mencoba percakapan. Isi ketika ingin menguji lead capture dan follow-up.</p><div class="lead"><input id="leadName" placeholder="Nama"><input id="leadPhone" placeholder="WhatsApp, contoh 0881..."><label class="check"><input id="consent" type="checkbox"> Saya setuju data kontak ini digunakan untuk tindak lanjut kebutuhan rental yang saya minta.</label><div id="leadStatus" class="status"></div></div><div class="notice" style="margin-top:13px">AI tidak mengirim WhatsApp otomatis dari browser. Lead dapat masuk ke queue Customer Care/admin sesuai konfigurasi operasional yang sudah ada.</div></aside><section class="card chatbox"><div><h3 style="margin-bottom:4px">AI Customer Service TransMind</h3><span class="muted">Coba: “Saya butuh Avanza 2 hari dengan driver minggu depan”</span></div><div id="messages" class="messages"></div><div class="composer"><input id="chatInput" placeholder="Tulis kebutuhan Anda..."><button class="primary" onclick="send()">Kirim</button></div></section></section></main>');document.getElementById("days").textContent=Math.ceil(remaining()/86400000)+" hari";welcome()}
function welcome(){const box=document.getElementById("messages");if(!box||chat.length)return;chat=[{role:"ai",text:"Halo, saya Customer Service TransMind. Ceritakan saja kebutuhan perjalanan Anda dengan bahasa biasa. Saya bantu sampai jelas dulu—kalau membutuhkan keputusan admin, saya akan teruskan konteksnya."}];paint()}
function paint(){const box=document.getElementById("messages");if(!box)return;box.innerHTML=chat.map(x=>'<div class="bubble '+(x.role==="me"?"me":"ai")+'">'+esc(x.text)+'</div>').join("");box.scrollTop=box.scrollHeight}
async function send(){
 if(!active())return render();
 const input=document.getElementById("chatInput"),msg=input.value.trim();if(!msg)return;
 chat.push({role:"me",text:msg});input.value="";paint();
 const status=document.getElementById("leadStatus");if(status)status.textContent="AI sedang membaca konteks...";
 const name=document.getElementById("leadName")?.value.trim()||"",phone=document.getElementById("leadPhone")?.value.trim()||"",consent=Boolean(document.getElementById("consent")?.checked);
 const sessionId=trial.sessionId;
 try{
  const r=await fetch(SB_URL+"/functions/v1/transmind-ai",{method:"POST",headers:{"Content-Type":"application/json","apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY},body:JSON.stringify({message:msg,session_id:sessionId,path:"/nexus/trial/",referrer:document.referrer||"",lead:{name,phone,consent}})});
  const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"AI sementara tidak tersedia.");
  chat.push({role:"ai",text:d.answer||"Baik, saya bantu lanjutkan kebutuhan Anda."});trial.messages=(trial.messages||0)+1;localStorage.setItem(KEY,JSON.stringify(trial));paint();
  if(status)status.textContent=d.lead?.captured?"Lead tercatat dan masuk alur Customer Care.":"Percakapan berjalan; isi nama + WhatsApp + persetujuan untuk menguji lead follow-up.";
 }catch(e){chat.push({role:"ai",text:"Maaf, saya belum bisa terhubung ke Customer Service saat ini. Silakan lanjutkan melalui WhatsApp TransMind."});paint();if(status)status.textContent="Koneksi AI belum tersedia.";console.error(e)}
}
setInterval(()=>{if(!trial)trial=getTrial();if(trial&&Date.now()>=trial.expiresAt){render();return}const t=document.getElementById("timer");if(t&&trial)t.textContent="TRIAL · "+fmt(remaining());const d=document.getElementById("days");if(d&&trial)d.textContent=Math.ceil(remaining()/86400000)+" hari"},30000);
render();
</script>
</body>
</html>
