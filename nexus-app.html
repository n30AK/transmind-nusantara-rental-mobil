<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TransMind Nexus — Operations App</title><link rel="stylesheet" href="css/nexus-app.css"></head><body><div id="app"><aside class="sidebar"><div class="brand"><img src="logo/transmind.png"><div><b>TRANSMIND</b><small>NEXUS APP</small></div></div><div class="userbox"><span id="userEmail">Belum login</span><button id="logoutBtn" hidden>Keluar</button></div><nav id="menu"></nav></aside><main class="main"><header class="topbar"><button id="mobileMenu">☰</button><div><span class="eyebrow">OPERATIONS CONTROL</span><h1 id="pageTitle">Masuk ke Nexus</h1></div><span id="saveState" class="state"></span></header><section id="loginView" class="login-card"><h2>TransMind Nexus</h2><p>Aplikasi operasional untuk mengelola data, bukan sekadar dashboard.</p><form id="loginForm"><label>Email<input id="loginEmail" type="email" required></label><label>Password<input id="loginPassword" type="password" required></label><button class="primary">MASUK</button><p id="loginError" class="error"></p></form></section><section id="workspace" hidden><div class="toolbar"><div><strong id="moduleTitle">Data</strong><span id="moduleHint"></span></div><div class="toolbar-actions"><input id="searchBox" placeholder="Cari data..."><button id="newBtn" class="primary">＋ Data Baru</button><button id="refreshBtn">↻ Refresh</button></div></div><div id="appNotice"></div><div class="workspace-grid"><section class="list-panel"><div id="listMeta" class="list-meta"></div><div id="dataList"></div></section><section class="form-panel"><div class="form-head"><div><span class="eyebrow">RECORD EDITOR</span><h2 id="formTitle">Pilih data</h2></div><button id="backBtn">← Kembali</button></div><form id="recordForm"></form><div class="form-actions"><button id="deleteBtn" class="danger" type="button">Hapus</button><button id="resetBtn" type="button">Batal</button><button id="saveBtn" class="primary
